[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transev-charger-on-wheels-backend"
version = "0.1.0"
description = "Independent Charger on Wheels CMS API; Go HAL connects through a versioned boundary"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3", "django-ninja>=1.4,<2", "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26", "pydantic>=2.10,<3", "httpx>=0.27,<1",
  "PyYAML>=6,<7", "cryptography>=43,<48", "gunicorn>=23,<25", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.11,<1", "pyright>=1.1,<2", "freezegun>=1.5,<2", "jsonschema>=4.22,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires positively identified isolated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["config*", "cow*"]

# Byte-pinned legacy exceptions; see docs/RUFF_LEGACY_DEBT.md and its test.
[tool.ruff.lint.per-file-ignores]
