    PricingScope:
      type: object
      additionalProperties: false
      required: [kind, key]
      properties:
        kind:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          example: SERVICE_ZONE
        key:
          type: string
          maxLength: 160
          example: ZONE_7
      description: |
        A validated operational scope identifier, NOT a hub ID. Examples are GLOBAL/ALL, SERVICE_ZONE/ZONE_7,
        SERVICE_TIER/PRIORITY. Exact scope precedence belongs to the trusted quote orchestrator, never the browser.
    PricingRule:
      type: object
      additionalProperties: false
      required: [id, kind, rate, priority]
      properties:
        id:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        kind:
          type: string
          enum: [BASE, OVERRIDE_RATE, MULTIPLIER, DISCOUNT_PERCENT]
        component:
          type: string
          description: Required on BASE; e.g. VISIT, TRAVEL, CHARGING_ENERGY.
        basis:
          type: string
          description: Required on BASE; e.g. VISITS, ROUTE_KM, METER_KWH, WAIT_MINUTES.
        rate:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
          description: |
            INR per basis unit on BASE and OVERRIDE_RATE; percent on MULTIPLIER (100 unchanged) and
            DISCOUNT_PERCENT (0-100). Six fractional digits maximum. JSON numbers are rejected.
          example: '16.91'
        target:
          type: string
          description: For modifiers, ID of exactly one BASE rule.
        tax_class:
          type: string
          description: Required on BASE; a reference to an independently approved tax decision.
        priority:
          type: integer
          minimum: 0
          maximum: 100000
        conditions:
          type: object
          additionalProperties:
            type: string
          description: Simple equality conditions evaluated only against trusted, normalized facts.
    PricingDraftRequest:
      type: object
      additionalProperties: false
      required: [policy_key, policy_version, scope, currency, rules, reason]
      properties:
