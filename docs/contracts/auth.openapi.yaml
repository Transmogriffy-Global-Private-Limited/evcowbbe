openapi: 3.1.0
info:
  title: EVCOWBBE | Charger on Wheels Authentication API
  version: 0.2.0
  description: |
    Implemented EVCOWBBE authentication and Admin RBAC foundation (52 operations). Customer app, driver and administrator are distinct authorization planes; no charger booking, dispatch, payment, driver-approval or business-domain Admin operations exist in this release.

    All successful API responses contain a `data` envelope; failures contain an `error` object with `code`, `message`, `request_id` and `details`. JSON mutations (POST, PUT, DELETE where implemented) require `Content-Type: application/json`, even logout operations whose body is ignored. Strict JSON decoding rejects unknown fields, multiple JSON values and bodies above 32 KiB on decoded routes. Responses include `X-Request-ID` and `Cache-Control: no-store`.

    **Interactive safety:** Swagger `Try it out` invokes the actual same-origin server and can register users, send real email, revoke tokens/sessions, or change passwords/2FA. Use only specifically authorized test accounts. Example tokens, passwords, UUIDs and addresses are illustrative and intentionally not real credentials. Never paste real tokens into screenshots/logs, or store them in browser persistent storage. The UI does not persist authorization across reloads.

    Auth: access and refresh are separate opaque 256-bit random tokens, not JWTs. Access defaults to 15 minutes; refresh is rotated with a default rolling 30-day window and 90-day absolute session cap. Each token belongs to one plane. Email OTP 2FA is optional, not phishing-resistant, and depends on the same mailbox used for recovery. Auth email is transactionally queued for asynchronous delivery; an API success is not proof of inbox arrival. Admin accounts are bootstrapped by trusted local CLI only, and Admin capabilities require explicit role/override grants. A driver's `PENDING` status is not operating approval.
servers:
- url: /
  description: Same origin as the Swagger page, either localhost or the deployed HTTPS host
tags:
- name: Email & Recovery
  description: Global, publicly callable one-time email verification and password recovery.
- name: Customer App
  description: 'The `app` plane: end-customer account authentication and profile.'
- name: Driver
  description: 'The `driver` plane: authentication only; `PENDING` is not operational approval.'
- name: Admin
  description: 'The `admin` plane: CLI-bootstrapped authentication plus explicit Annex 44 RBAC capabilities; no business-domain Admin actions yet.'
- name: Diagnostics
  description: Public liveness, database readiness and logical API version.
paths:
  /api/v1/auth/verify-email:
    post:
      tags:
      - Email & Recovery
      operationId: verifyEmail
      summary: Verify registered email
      description: Consume the single-use 24-hour token received after app/driver registration (or resend). Repeated/expired/invalid
        tokens are rejected. No bearer authentication is required. This does **not** log the account in.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionTokenRequest'
            example:
              token: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
  /api/v1/auth/resend-verification:
    post:
      tags:
      - Email & Recovery
      operationId: resendVerification
      summary: Resend an email verification token
      description: 'Deliberately returns the same `accepted: true` response for unknown, invalid or already-verified
        addresses. Eligible unverified accounts receive a replacement token; previous verification tokens are invalidated.
        Subject to IP and per-account rate limits. Eligible messages are queued transactionally for later SMTP delivery.'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: person@example.test
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Email & Recovery
      operationId: forgotPassword
      summary: Request an emailed password-reset token
      description: Deliberately hides email/account existence. If eligible and previously verified, a single-use
        20-minute reset token is emailed; prior reset tokens are replaced. Do not display whether an email was delivered.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: person@example.test
  /api/v1/auth/reset-password:
    post:
      tags:
      - Email & Recovery
      operationId: resetPassword
      summary: Reset password using email token
      description: Consumes the emailed single-use 20-minute reset token, enforces password policy, and **revokes
        all sessions across planes** for the account. Sign in again after success. Notification email failures after
        commit do not roll back the reset.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/PasswordPolicy'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
              new_password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/register:
    post:
      tags:
      - Customer App
      operationId: register_app
      summary: Register customer app account
      description: Create a new account and send the 24-hour verification token. A valid duplicate email intentionally
        returns the same HTTP 202 response, preventing account enumeration. One email maps to one account; no automatic
        linking/promotion exists. Customer principal begins as `ACTIVE`, but cannot log in until the email is verified.
      security: []
      responses:
        '202':
          $ref: '#/components/responses/RegisteredApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/PasswordPolicy'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
            example:
              email: person@example.test
              password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/login:
    post:
      tags:
      - Customer App
      operationId: app_auth_login
      summary: Log in as customer app
      description: 'Requires a verified email and the matching plane principal. If email 2FA is disabled, `data.tokens`
        contains new credentials. If enabled, only `data.challenge_id` and `data.two_factor_required: true` are
        returned; call this plane''s `verify-otp` endpoint with the emailed code to receive tokens. Admin accounts
        cannot be created through public registration.'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/LoginApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
            example:
              email: person@example.test
              password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/verify-otp:
    post:
      tags:
      - Customer App
      operationId: app_auth_verify_otp
      summary: Complete customer app 2FA login
      description: Use the LOGIN_2FA challenge ID returned by `login` and its emailed six-digit code. A code is
        single-use, expires after the configured TTL and has a bounded number of attempts. The challenge must belong
        to this plane. A successful response issues opaque access and refresh credentials.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/TokensApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidOrExpiredOTP'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
            example:
              challenge_id: 00000000-0000-4000-8000-000000000000
              code: '012345'
  /api/v1/app/auth/refresh:
    post:
      tags:
      - Customer App
      operationId: app_auth_refresh
      summary: Rotate customer app session tokens
      description: 'Exchange the current opaque refresh token for a new access/refresh pair in the **same server-side
        session**. Previous refresh token is consumed atomically; reusing it revokes the session. The session also
        has an absolute time limit (default 90 days). This is not a Bearer-authorized endpoint: pass the refresh
        credential only in JSON.'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/TokensApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidOrReusedRefresh'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
  /api/v1/app/auth/2fa/resend:
    post:
      tags:
      - Customer App
      operationId: app_auth_2fa_resend
      summary: Resend customer app login OTP
      description: Resends only an existing active LOGIN_2FA challenge, **not** a 2FA enable/disable challenge.
        Resend rotates the code and extends the challenge's TTL, subject to cooldown/attempt/send limits. Same challenge
        ID is retained; previous code stops working.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidOrExpiredOTP'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            example:
              challenge_id: 00000000-0000-4000-8000-000000000000
  /api/v1/app/me:
    get:
      tags:
      - Customer App
      operationId: app_me
      summary: Read current customer app profile
      description: Returns only the profile associated with the bearer token's exact plane; there is no cross-plane
        access. `principal_status` is informational; for drivers, `PENDING` does not authorize any driver operational
        workflow.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProfileApp'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '405':
          $ref: '#/components/responses/WrongMethod'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/app/auth/logout:
    post:
      tags:
      - Customer App
      operationId: app_auth_logout
      summary: Log out current customer app session
      description: 'Immediately revokes the session identified by the access bearer; other sessions stay active.
        Send `Content-Type: application/json` (and `{}` if using Swagger''s request body), even though the server
        ignores the payload. Repeating with the revoked bearer no longer authenticates.'
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        description: 'Payload is ignored by the server, but `Content-Type: application/json` is mandatory. Send
          `{}` from Swagger/curl for compatibility; no credentials belong in the body.'
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored payload; `{}` recommended.
            example: {}
  /api/v1/app/auth/logout-all:
    post:
      tags:
      - Customer App
      operationId: app_auth_logout_all
      summary: Log out of every session
      description: Revokes all non-revoked sessions belonging to the account **across all planes**, including the
        session used to call this endpoint. The JSON payload is ignored, but a JSON content-type is mandatory.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        description: 'Payload is ignored by the server, but `Content-Type: application/json` is mandatory. Send
          `{}` from Swagger/curl for compatibility; no credentials belong in the body.'
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored payload; `{}` recommended.
            example: {}
  /api/v1/app/auth/password/change:
    post:
      tags:
      - Customer App
      operationId: app_auth_password_change
      summary: Change customer app account password
      description: Requires current password, a new policy-compliant password and the access bearer. On success,
        revokes **every session of the account across planes**, including this request's session; obtain fresh credentials
        before further calls. A security email is attempted after commit.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/PasswordPolicy'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: YourExistingSecretNotAnExample
              new_password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/2fa/enable/begin:
    post:
      tags:
      - Customer App
      operationId: app_auth_2fa_enable_begin
      summary: Begin enable email 2FA
      description: Reconfirm the current account password and email a purpose-bound six-digit code to enable 2FA.
        The account's current state must differ from the requested state, and a successful response includes `challenge_id`.
        Confirm in the **same plane** and for the same action. The login OTP resend endpoint does not apply to these
        challenges.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Begin2FA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '409':
          $ref: '#/components/responses/StateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Begin2FARequest'
            example:
              password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/2fa/enable/confirm:
    post:
      tags:
      - Customer App
      operationId: app_auth_2fa_enable_confirm
      summary: Confirm enable email 2FA
      description: Submit the six-digit code and challenge ID created by this plane's `enable/begin` action. On
        success, account-wide 2FA becomes enabled; **other sessions are revoked** while the current session remains
        valid. Expired, consumed, mismatched, or exhausted challenges are rejected.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidOrExpiredOTP'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '409':
          $ref: '#/components/responses/StateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
            example:
              challenge_id: 00000000-0000-4000-8000-000000000000
              code: '012345'
  /api/v1/app/auth/2fa/disable/begin:
    post:
      tags:
      - Customer App
      operationId: app_auth_2fa_disable_begin
      summary: Begin disable email 2FA
      description: Reconfirm the current account password and email a purpose-bound six-digit code to disable 2FA.
        The account's current state must differ from the requested state, and a successful response includes `challenge_id`.
        Confirm in the **same plane** and for the same action. The login OTP resend endpoint does not apply to these
        challenges.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Begin2FA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '409':
          $ref: '#/components/responses/StateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Begin2FARequest'
            example:
              password: IllustrativeOnly!2026NeverReuse
  /api/v1/app/auth/2fa/disable/confirm:
    post:
      tags:
      - Customer App
      operationId: app_auth_2fa_disable_confirm
      summary: Confirm disable email 2FA
      description: Submit the six-digit code and challenge ID created by this plane's `disable/begin` action. On
        success, account-wide 2FA becomes disabled; **other sessions are revoked** while the current session remains
        valid. Expired, consumed, mismatched, or exhausted challenges are rejected.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidOrExpiredOTP'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '409':
          $ref: '#/components/responses/StateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
            example:
              challenge_id: 00000000-0000-4000-8000-000000000000
              code: '012345'
  /api/v1/app/vehicles:
    post:
      tags:
      - Customer App
      operationId: register_customer_vehicle
      summary: Register customer vehicle
      description: Register a new electric vehicle for the authenticated customer. The first vehicle is automatically marked as default.
      security:
      - BearerAuth: []
      responses:
        '201':
          $ref: '#/components/responses/VehicleCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '409':
          $ref: '#/components/responses/StateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            example:
              name: My Nexon EV
              vehicle_type: CAR
              make: Tata
              model: Nexon EV
              registration_number: KA01AB1234
              battery_capacity_kwh: 40.5
              is_default: true
    get:
      tags:
      - Customer App
      operationId: list_customer_vehicles
      summary: List customer vehicles
      description: Returns all vehicles registered by the authenticated customer account.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VehicleList'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
  /api/v1/app/vehicles/{id}:
    get:
      tags:
