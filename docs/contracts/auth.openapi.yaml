          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            example:
              challenge_id: 00000000-0000-4000-8000-000000000000
  /api/v1/admin/me:
    get:
      tags:
      - Admin
      operationId: admin_me
      summary: Read current administrator profile
      description: Returns only the profile associated with the bearer token's exact plane; there is no cross-plane
        access. `principal_status` is informational; for drivers, `PENDING` does not authorize any driver operational
        workflow.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProfileAdmin'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '405':
          $ref: '#/components/responses/WrongMethod'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Admin
      operationId: admin_auth_logout
      summary: Log out current administrator session
      description: 'Immediately revokes the session identified by the access bearer; other sessions stay active.
        Send `Content-Type: application/json` (and `{}` if using Swagger''s request body), even though the server
        ignores the payload. Repeating with the revoked bearer no longer authenticates.'
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        description: 'Payload is ignored by the server, but `Content-Type: application/json` is mandatory. Send
          `{}` from Swagger/curl for compatibility; no credentials belong in the body.'
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored payload; `{}` recommended.
            example: {}
  /api/v1/admin/auth/logout-all:
    post:
      tags:
      - Admin
      operationId: admin_auth_logout_all
      summary: Log out of every session
      description: Revokes all non-revoked sessions belonging to the account **across all planes**, including the
        session used to call this endpoint. The JSON payload is ignored, but a JSON content-type is mandatory.
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/WrongPlane'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '500':
          $ref: '#/components/responses/Internal'
        '405':
          $ref: '#/components/responses/WrongMethod'
      requestBody:
        description: 'Payload is ignored by the server, but `Content-Type: application/json` is mandatory. Send
          `{}` from Swagger/curl for compatibility; no credentials belong in the body.'
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored payload; `{}` recommended.
            example: {}
  /api/v1/admin/auth/password/change:
    post:
      tags:
      - Admin
      operationId: admin_auth_password_change
      summary: Change administrator account password
      description: Requires current password, a new policy-compliant password and the access bearer. On success,
        revokes **every session of the account across planes**, including this request's session; obtain fresh credentials
        before further calls. A security email is attempted after commit.
      security:
      - BearerAuth: []
      responses:
