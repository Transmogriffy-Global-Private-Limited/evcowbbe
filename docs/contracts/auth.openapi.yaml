      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationEnvelope'
          example:
            data:
              message: If eligible, a verification email has been queued
              plane: driver
    BadRequest:
      description: Malformed JSON, unknown request fields, oversized JSON body (32 KiB), or multiple JSON values.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation_failed:
              summary: VALIDATION_FAILED
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Invalid JSON request
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidCredentials:
      description: Invalid credentials, verification/reset token, access token, refresh token or OTP.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidOrExpiredOTP:
      description: Invalid or expired/exhausted OTP challenge.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            otp_expired:
              summary: OTP_EXPIRED
              value:
                error:
                  code: OTP_EXPIRED
                  message: Code expired or exhausted
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidOrReusedRefresh:
      description: Invalid refresh token; reuse of a previously rotated token revokes that session family.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            refresh_token_reused:
              summary: REFRESH_TOKEN_REUSED
              value:
                error:
                  code: REFRESH_TOKEN_REUSED
                  message: Session revoked; sign in again
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    EmailNotVerified:
      description: Account email must be verified before login.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            email_not_verified:
              summary: EMAIL_NOT_VERIFIED
              value:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Verify your email first
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    WrongPlane:
      description: The principal, challenge or token does not belong to the specified plane, or its state forbids
        this action.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            principal_plane_mismatch:
              summary: PRINCIPAL_PLANE_MISMATCH
              value:
                error:
                  code: PRINCIPAL_PLANE_MISMATCH
                  message: Access not permitted for this principal
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    AdminForbidden:
      description: Either the bearer belongs to another principal plane or the authenticated Admin lacks an explicit required capability. A role label alone does not authorize business operations.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            capability_denied:
              summary: CAPABILITY_DENIED
              value:
                error:
                  code: CAPABILITY_DENIED
                  message: Administrative capability required
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            wrong_plane:
              summary: PRINCIPAL_PLANE_MISMATCH
              value:
                error:
                  code: PRINCIPAL_PLANE_MISMATCH
                  message: Access not permitted for this principal
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    RBACNotFound:
      description: No matching Admin principal or RBAC route exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Admin not found
              request_id: 00000000-0000-4000-8000-000000000000
              details: {}
    RBACConflict:
      description: Conflicting role assignment or a privilege change rejected to avoid administrative lockout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: RBAC change would violate a safety rule
              request_id: 00000000-0000-4000-8000-000000000000
              details: {}
    RBACValidation:
      description: Invalid Admin role, capability, decision or audit reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid RBAC request
              request_id: 00000000-0000-4000-8000-000000000000
              details: {}
    StateConflict:
      description: Requested 2FA state already exists or changed concurrently.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            conflict:
              summary: CONFLICT
              value:
                error:
                  code: CONFLICT
                  message: Account or state already exists
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    UnsupportedContentType:
      description: 'POST requires `Content-Type: application/json`, even for empty logout bodies.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unsupported_media_type:
              summary: UNSUPPORTED_MEDIA_TYPE
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Expected application/json
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    PasswordPolicy:
      description: New password violates length or common-password policy.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation_failed:
              summary: VALIDATION_FAILED
              value:
                error:
                  code: VALIDATION_FAILED
                  message: password must contain 12-256 UTF-8 bytes
                  request_id: 00000000-0000-4000-8000-000000000000
