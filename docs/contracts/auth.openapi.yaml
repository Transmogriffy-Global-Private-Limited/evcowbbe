    post:
      operationId: verifyEmail
      summary: verifyEmail
      security: []
      responses:
        '200':
          description: Successful response in data envelope
        '400':
          description: Invalid JSON or body
        '429':
          description: Rate limited
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
