        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/RBACValidation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      tags: [Admin]
      operationId: admin_rbac_override_remove
      summary: Remove a direct ALLOW or DENY
      description: Requires system.settings.manage and a reason. Remaining default grants then determine effective permission.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/RBACNotFound'
        '409':
          $ref: '#/components/responses/RBACConflict'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/RBACValidation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /health/live:
    get:
      tags:
      - Diagnostics
      operationId: health_live
      summary: Liveness probe
      description: Reports that the process can handle requests. **Does not** test PostgreSQL, SMTP delivery, or
        end-to-end authentication. Avoid using this alone for deployment acceptance.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Live'
  /health/ready:
    get:
      tags:
      - Diagnostics
      operationId: health_ready
      summary: Database readiness probe
      description: Pings PostgreSQL with a two-second timeout. HTTP 200 means this dependency was reachable for
        that request; it does **not** prove SMTP message delivery or successful login.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ready'
        '503':
          $ref: '#/components/responses/ReadinessUnavailable'
  /version:
    get:
      tags:
      - Diagnostics
      operationId: version
      summary: Logical API version
      description: Returns the fixed version identifier for this authentication foundation. This is not a Git revision,
        binary hash, or build timestamp.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Version'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Paste an *access* token received from login/verify-otp/refresh for this exact app, driver or
        admin plane. Not JWT, not a refresh token. No cookies or implicit OAuth flow.
  headers:
    RequestID:
      description: Request correlation UUID; also returned in JSON error bodies.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000000
    RetryAfter:
      description: Seconds until retry is advised (currently 60).
      schema:
        type: integer
        minimum: 0
      example: 60
  schemas:
    Email:
      type: string
      description: Case-insensitive; trimmed and normalized to lowercase. Maximum 254 bytes. One account per email
        across planes.
      format: email
      maxLength: 254
      example: person@example.test
    Password:
      type: string
      description: 12-256 UTF-8 **bytes** (not necessarily 12-256 Unicode characters). Common substrings are rejected.
        Use a unique secret, never the illustrative sample.
      format: password
      writeOnly: true
      example: IllustrativeOnly!2026NeverReuse
    ActionToken:
      type: string
      description: Single-use opaque 43-character URL-safe token delivered by email. Not a JWT; never include it
        in a URL, log or screenshot.
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
      writeOnly: true
      example: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    RefreshToken:
      type: string
      description: Opaque 43-character rotating refresh credential. Single-use on refresh; reuse revokes its session
        family. Never use as an access bearer.
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
      writeOnly: true
      example: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    ChallengeID:
      type: string
      description: Challenge identifier returned by login or a 2FA begin operation. OTP challenges are bound to
        their plane and purpose.
      format: uuid
      example: 00000000-0000-4000-8000-000000000000
    OTPCode:
      type: string
      description: Six-digit emailed one-time code, including leading zeroes. Expires after configured TTL (10 minutes
        in the documented default) with limited attempts.
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]{6}$
      writeOnly: true
      example: '012345'
    CredentialsRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
      required:
      - email
      - password
    EmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
      required:
      - email
    ActionTokenRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/ActionToken'
      required:
      - token
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/ActionToken'
        new_password:
          $ref: '#/components/schemas/Password'
      required:
      - token
      - new_password
    OTPRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
        code:
          $ref: '#/components/schemas/OTPCode'
      required:
      - challenge_id
      - code
    ChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
      required:
      - challenge_id
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
      required:
      - refresh_token
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
      required:
      - current_password
      - new_password
    Begin2FARequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/Password'
      required:
      - password
    TokenPair:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Opaque access bearer; 43 URL-safe characters, not JWT.
          minLength: 43
          maxLength: 43
          example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        refresh_token:
          type: string
          description: Rotating opaque refresh token; do not use as a bearer token.
          minLength: 43
          maxLength: 43
          example: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
        token_type:
          type: string
          description: HTTP Authorization scheme.
          const: Bearer
          example: Bearer
        access_expires_at:
          type: string
          description: Access-token expiry in RFC 3339 UTC (default 15 minutes after issuance).
          format: date-time
        refresh_expires_at:
          type: string
          description: Refresh-token expiry in RFC 3339 UTC, capped by the session absolute expiry.
          format: date-time
        session_id:
          type: string
          description: Identity of the server-side PostgreSQL session.
          format: uuid
        plane:
          type: string
          description: Token is valid only for this API plane.
          enum:
          - app
          - driver
          - admin
      required:
      - access_token
      - refresh_token
      - token_type
      - access_expires_at
      - refresh_expires_at
      - session_id
      - plane
    LoginWithTokens:
      type: object
      additionalProperties: false
      properties:
        two_factor_required:
          type: boolean
          description: False when the login immediately issued credentials.
          const: false
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - two_factor_required
      - tokens
    LoginWithChallenge:
      type: object
      additionalProperties: false
      properties:
        two_factor_required:
          type: boolean
          description: True when the one-time email challenge must be verified before tokens are issued.
          const: true
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
      required:
      - two_factor_required
      - challenge_id
    LoginOutcome:
      oneOf:
      - $ref: '#/components/schemas/LoginWithTokens'
      - $ref: '#/components/schemas/LoginWithChallenge'
      description: 'Exactly one of two outcomes: token issuance or a required email-OTP challenge. Never assume
        `tokens` exists without checking `two_factor_required`.'
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Account UUID, shared identity; not a per-plane driver approval ID.
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        plane:
          type: string
          description: Current authenticated plane.
          enum:
          - app
          - driver
          - admin
        principal_status:
          type: string
          description: Driver PENDING status is not permission to dispatch or operate chargers.
          enum:
          - ACTIVE
          - PENDING
          - SUSPENDED
        email_verified:
          type: boolean
          description: Whether the account email was verified.
        two_factor_enabled:
          type: boolean
          description: Whether email OTP is required on new logins.
      required:
      - id
      - email
      - plane
      - principal_status
      - email_verified
      - two_factor_enabled
    AckData:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
      - ok
    AcceptedData:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
      required:
      - accepted
    RegistrationData:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          const: If eligible, a verification email has been queued
        plane:
          type: string
          enum:
          - app
          - driver
      required:
      - message
      - plane
    Begin2FAData:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
        message:
          type: string
          const: Check email for one-time code
      required:
      - challenge_id
      - message
    HealthData:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - live
          - ready
      required:
      - status
    VersionData:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          const: auth-foundation-2
      required:
      - version
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable application error identifier; use with HTTP status.
        message:
          type: string
          description: Human-readable safe description; contains no internal database/SMTP diagnostics.
        request_id:
          type: string
          description: Correlates this error with the `X-Request-ID` response header.
          format: uuid
        details:
          type: object
          description: Present as an empty JSON object in this implementation.
          additionalProperties: true
          example: {}
      required:
      - code
      - message
      - request_id
      - details
    AckEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AckData'
      required:
      - data
    AcceptedEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AcceptedData'
      required:
      - data
    RegistrationEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/RegistrationData'
      required:
      - data
    LoginEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LoginOutcome'
      required:
      - data
    TokenEnvelope:
      type: object
