      type: string
      description: Case-insensitive; trimmed and normalized to lowercase. Maximum 254 bytes. One account per email
        across planes.
      format: email
      maxLength: 254
      example: person@example.test
    Password:
      type: string
      description: 12-256 UTF-8 **bytes** (not necessarily 12-256 Unicode characters). Common substrings are rejected.
        Use a unique secret, never the illustrative sample.
      format: password
      writeOnly: true
      example: IllustrativeOnly!2026NeverReuse
    ActionToken:
      type: string
      description: Single-use opaque 43-character URL-safe token delivered by email. Not a JWT; never include it
        in a URL, log or screenshot.
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
      writeOnly: true
      example: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    RefreshToken:
      type: string
      description: Opaque 43-character rotating refresh credential. Single-use on refresh; reuse revokes its session
        family. Never use as an access bearer.
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
      writeOnly: true
      example: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    ChallengeID:
      type: string
      description: Challenge identifier returned by login or a 2FA begin operation. OTP challenges are bound to
        their plane and purpose.
      format: uuid
      example: 00000000-0000-4000-8000-000000000000
    OTPCode:
      type: string
      description: Six-digit emailed one-time code, including leading zeroes. Expires after configured TTL (10 minutes
        in the documented default) with limited attempts.
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]{6}$
      writeOnly: true
      example: '012345'
