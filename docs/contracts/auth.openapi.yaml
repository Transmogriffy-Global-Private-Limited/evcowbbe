      required: true
      schema: {type: string}
    delete:
      tags: [Admin]
      operationId: admin_rbac_role_remove
      summary: Revoke a default Admin role
      description: Requires system.settings.manage and a reason; rejects self-changes and removal of the final FULL_ADMIN assignment.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
