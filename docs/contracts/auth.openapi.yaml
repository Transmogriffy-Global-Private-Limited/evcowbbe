    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
      required:
      - current_password
      - new_password
    Begin2FARequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/Password'
      required:
      - password
    TokenPair:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Opaque access bearer; 43 URL-safe characters, not JWT.
          minLength: 43
          maxLength: 43
          example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        refresh_token:
          type: string
          description: Rotating opaque refresh token; do not use as a bearer token.
          minLength: 43
          maxLength: 43
          example: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
        token_type:
          type: string
          description: HTTP Authorization scheme.
          const: Bearer
          example: Bearer
        access_expires_at:
          type: string
          description: Access-token expiry in RFC 3339 UTC (default 15 minutes after issuance).
          format: date-time
        refresh_expires_at:
          type: string
          description: Refresh-token expiry in RFC 3339 UTC, capped by the session absolute expiry.
          format: date-time
        session_id:
          type: string
          description: Identity of the server-side PostgreSQL session.
          format: uuid
        plane:
          type: string
          description: Token is valid only for this API plane.
          enum:
          - app
          - driver
          - admin
      required:
      - access_token
      - refresh_token
      - token_type
      - access_expires_at
      - refresh_expires_at
      - session_id
      - plane
    LoginWithTokens:
      type: object
      additionalProperties: false
      properties:
        two_factor_required:
          type: boolean
          description: False when the login immediately issued credentials.
          const: false
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - two_factor_required
      - tokens
    LoginWithChallenge:
      type: object
      additionalProperties: false
      properties:
        two_factor_required:
          type: boolean
          description: True when the one-time email challenge must be verified before tokens are issued.
          const: true
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
      required:
      - two_factor_required
      - challenge_id
    LoginOutcome:
      oneOf:
      - $ref: '#/components/schemas/LoginWithTokens'
      - $ref: '#/components/schemas/LoginWithChallenge'
      description: 'Exactly one of two outcomes: token issuance or a required email-OTP challenge. Never assume
        `tokens` exists without checking `two_factor_required`.'
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Account UUID, shared identity; not a per-plane driver approval ID.
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        plane:
          type: string
          description: Current authenticated plane.
          enum:
          - app
          - driver
          - admin
        principal_status:
          type: string
          description: Driver PENDING status is not permission to dispatch or operate chargers.
          enum:
          - ACTIVE
          - PENDING
          - SUSPENDED
        email_verified:
          type: boolean
          description: Whether the account email was verified.
        two_factor_enabled:
          type: boolean
          description: Whether email OTP is required on new logins.
      required:
      - id
      - email
      - plane
      - principal_status
      - email_verified
      - two_factor_enabled
    AckData:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
      - ok
    AcceptedData:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
      required:
      - accepted
    RegistrationData:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          const: If eligible, a verification email has been queued
        plane:
          type: string
          enum:
          - app
          - driver
      required:
      - message
      - plane
    Begin2FAData:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeID'
        message:
          type: string
          const: Check email for one-time code
      required:
      - challenge_id
      - message
    HealthData:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - live
          - ready
      required:
      - status
    VersionData:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          const: auth-foundation-2
      required:
      - version
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable application error identifier; use with HTTP status.
        message:
          type: string
          description: Human-readable safe description; contains no internal database/SMTP diagnostics.
        request_id:
          type: string
          description: Correlates this error with the `X-Request-ID` response header.
          format: uuid
        details:
          type: object
          description: Present as an empty JSON object in this implementation.
          additionalProperties: true
          example: {}
      required:
      - code
      - message
      - request_id
      - details
    AckEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AckData'
      required:
      - data
    AcceptedEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AcceptedData'
      required:
      - data
    RegistrationEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/RegistrationData'
      required:
      - data
    LoginEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LoginOutcome'
      required:
      - data
    TokenEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
      required:
      - data
    ProfileEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
      - data
    Begin2FAEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Begin2FAData'
      required:
      - data
    HealthEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
      required:
      - data
    VersionEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/VersionData'
      required:
      - data
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
  responses:
    PricingItem:
      description: Stored immutable Admin pricing revision; ETag identifies publication state_version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        ETag:
          description: Current quoted state_version for publish or withdraw.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PricingItemEnvelope'
    PricingList:
      description: At most 100 Admin pricing records, newest first, no cursor in this initial slice.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PricingListEnvelope'
    PricingHistory:
      description: Most recent 100 immutable publication audit records, requiring audit.read.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PricingHistoryEnvelope'
    FleetItemResult:
      description: Versioned Fleet record. An ETag is set when the record has a version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        ETag:
          description: Quoted optimistic integer version, if supported by this resource.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FleetItemEnvelope'
    FleetListResult:
      description: Bounded Fleet collection. Client should follow next_cursor when present.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FleetListEnvelope'
    FleetHistoryResult:
      description: Most recent 100 append-only Fleet audit entries. Requires audit.read.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FleetHistoryEnvelope'
    FleetAvailabilityResult:
      description: Inventory state only; not HAL or dispatch certification.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FleetAvailabilityEnvelope'
    FleetNotFound:
      description: 404 Fleet resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FleetConflict:
      description: 409 Unsafe or conflicting Fleet state; retry only after reconciliation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FleetVersionMismatch:
      description: 412 If-Match version is stale; reload before attempting a different mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FleetValidation:
      description: 422 Invalid Fleet metadata, maintenance window or reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FleetPrecondition:
      description: 428 Required Idempotency-Key or If-Match header is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FleetKeyReuse:
      description: 409 Idempotency-Key was reused for a different operation or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Ack:
      description: Action completed. For password changes, all existing sessions are revoked; for 2FA confirmation,
        other sessions are revoked.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AckEnvelope'
          example:
            data:
              ok: true
    Accepted:
      description: Generic accepted result. Deliberately does not disclose whether the email/account exists or was
        eligible.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedEnvelope'
          example:
            data:
              accepted: true
    Begin2FA:
      description: A purpose-bound email-OTP challenge was created; use its ID and the emailed code on the matching
        confirm route.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Begin2FAEnvelope'
          example:
            data:
              challenge_id: 00000000-0000-4000-8000-000000000000
              message: Check email for one-time code
    Live:
      description: Process is responding. Does not check the database.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthEnvelope'
          example:
            data:
              status: live
    Ready:
      description: PostgreSQL responded to a bounded readiness ping.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthEnvelope'
          example:
            data:
              status: ready
    Version:
      description: Current program's logical API foundation version (not the Git commit or release ID).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionEnvelope'
          example:
            data:
              version: auth-foundation-2
    LoginApp:
      description: Credentials valid. Without 2FA the response contains tokens; with 2FA it contains a challenge
        ID but no tokens.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
          examples:
            without_2fa:
              summary: 2FA disabled; credentials issued
              value:
                data:
                  two_factor_required: false
                  tokens:
                    access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                    token_type: Bearer
                    access_expires_at: '2026-10-27T10:15:00Z'
                    refresh_expires_at: '2026-11-26T10:00:00Z'
                    session_id: 00000000-0000-4000-8000-000000000000
                    plane: app
            with_2fa:
              summary: 2FA enabled; verify emailed code
              value:
                data:
                  two_factor_required: true
                  challenge_id: 00000000-0000-4000-8000-000000000000
    TokensApp:
      description: New access + rotating refresh tokens. Store both securely; older refresh tokens are invalidated.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenEnvelope'
          example:
            data:
              access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              token_type: Bearer
              access_expires_at: '2026-10-27T10:15:00Z'
              refresh_expires_at: '2026-11-26T10:00:00Z'
              session_id: 00000000-0000-4000-8000-000000000000
              plane: app
    ProfileApp:
      description: Profile for the authenticated principal in the requested plane.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileEnvelope'
          example:
            data:
              id: 00000000-0000-4000-8000-000000000000
              email: app.user@example.test
              plane: app
              principal_status: ACTIVE
              email_verified: true
              two_factor_enabled: false
    LoginDriver:
      description: Credentials valid. Without 2FA the response contains tokens; with 2FA it contains a challenge
        ID but no tokens.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
          examples:
            without_2fa:
              summary: 2FA disabled; credentials issued
              value:
                data:
                  two_factor_required: false
                  tokens:
                    access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                    token_type: Bearer
                    access_expires_at: '2026-10-27T10:15:00Z'
                    refresh_expires_at: '2026-11-26T10:00:00Z'
                    session_id: 00000000-0000-4000-8000-000000000000
                    plane: driver
            with_2fa:
              summary: 2FA enabled; verify emailed code
              value:
                data:
                  two_factor_required: true
                  challenge_id: 00000000-0000-4000-8000-000000000000
    TokensDriver:
      description: New access + rotating refresh tokens. Store both securely; older refresh tokens are invalidated.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenEnvelope'
          example:
            data:
              access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              token_type: Bearer
              access_expires_at: '2026-10-27T10:15:00Z'
              refresh_expires_at: '2026-11-26T10:00:00Z'
              session_id: 00000000-0000-4000-8000-000000000000
              plane: driver
    ProfileDriver:
      description: Profile for the authenticated principal in the requested plane.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileEnvelope'
          example:
            data:
              id: 00000000-0000-4000-8000-000000000000
              email: driver.user@example.test
              plane: driver
              principal_status: PENDING
              email_verified: true
              two_factor_enabled: false
    LoginAdmin:
      description: Credentials valid. Without 2FA the response contains tokens; with 2FA it contains a challenge
        ID but no tokens.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
          examples:
            without_2fa:
              summary: 2FA disabled; credentials issued
              value:
                data:
                  two_factor_required: false
                  tokens:
                    access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                    token_type: Bearer
                    access_expires_at: '2026-10-27T10:15:00Z'
                    refresh_expires_at: '2026-11-26T10:00:00Z'
                    session_id: 00000000-0000-4000-8000-000000000000
                    plane: admin
            with_2fa:
              summary: 2FA enabled; verify emailed code
              value:
                data:
                  two_factor_required: true
                  challenge_id: 00000000-0000-4000-8000-000000000000
    TokensAdmin:
      description: New access + rotating refresh tokens. Store both securely; older refresh tokens are invalidated.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenEnvelope'
          example:
            data:
              access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              token_type: Bearer
              access_expires_at: '2026-10-27T10:15:00Z'
              refresh_expires_at: '2026-11-26T10:00:00Z'
              session_id: 00000000-0000-4000-8000-000000000000
              plane: admin
    ProfileAdmin:
      description: Profile for the authenticated principal in the requested plane.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileEnvelope'
          example:
            data:
              id: 00000000-0000-4000-8000-000000000000
              email: admin.user@example.test
              plane: admin
              principal_status: ACTIVE
              email_verified: true
              two_factor_enabled: false
    RegisteredApp:
      description: Accepted regardless of whether the email is already registered; an eligible new account has
        a single-use verification message queued for asynchronous SMTP delivery.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationEnvelope'
          example:
            data:
              message: If eligible, a verification email has been queued
              plane: app
    RegisteredDriver:
      description: Accepted regardless of whether the email is already registered; an eligible new account has
        a single-use verification message queued for asynchronous SMTP delivery.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationEnvelope'
          example:
            data:
              message: If eligible, a verification email has been queued
              plane: driver
    BadRequest:
      description: Malformed JSON, unknown request fields, oversized JSON body (32 KiB), or multiple JSON values.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation_failed:
              summary: VALIDATION_FAILED
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Invalid JSON request
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidCredentials:
      description: Invalid credentials, verification/reset token, access token, refresh token or OTP.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidOrExpiredOTP:
      description: Invalid or expired/exhausted OTP challenge.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            otp_expired:
              summary: OTP_EXPIRED
              value:
                error:
                  code: OTP_EXPIRED
                  message: Code expired or exhausted
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    InvalidOrReusedRefresh:
      description: Invalid refresh token; reuse of a previously rotated token revokes that session family.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid_credentials:
              summary: INVALID_CREDENTIALS
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials or token
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            refresh_token_reused:
              summary: REFRESH_TOKEN_REUSED
              value:
                error:
                  code: REFRESH_TOKEN_REUSED
                  message: Session revoked; sign in again
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    EmailNotVerified:
      description: Account email must be verified before login.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            email_not_verified:
              summary: EMAIL_NOT_VERIFIED
              value:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Verify your email first
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    WrongPlane:
      description: The principal, challenge or token does not belong to the specified plane, or its state forbids
        this action.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            principal_plane_mismatch:
              summary: PRINCIPAL_PLANE_MISMATCH
              value:
                error:
                  code: PRINCIPAL_PLANE_MISMATCH
                  message: Access not permitted for this principal
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    AdminForbidden:
      description: Either the bearer belongs to another principal plane or the authenticated Admin lacks an explicit required capability. A role label alone does not authorize business operations.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            capability_denied:
              summary: CAPABILITY_DENIED
              value:
                error:
                  code: CAPABILITY_DENIED
                  message: Administrative capability required
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
            wrong_plane:
              summary: PRINCIPAL_PLANE_MISMATCH
              value:
                error:
                  code: PRINCIPAL_PLANE_MISMATCH
                  message: Access not permitted for this principal
                  request_id: 00000000-0000-4000-8000-000000000000
                  details: {}
    RBACNotFound:
      description: No matching Admin principal or RBAC route exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Admin not found
              request_id: 00000000-0000-4000-8000-000000000000
              details: {}
    RBACConflict:
      description: Conflicting role assignment or a privilege change rejected to avoid administrative lockout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: RBAC change would violate a safety rule
              request_id: 00000000-0000-4000-8000-000000000000
              details: {}
    RBACValidation:
      description: Invalid Admin role, capability, decision or audit reason.
      content:
