      summary: Complete driver 2FA login
      description: Use the LOGIN_2FA challenge ID returned by `login` and its emailed six-digit code. A code is
        single-use, expires after the configured TTL and has a bounded number of attempts. The challenge must belong
        to this plane. A successful response issues opaque access and refresh credentials.
