      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: capability
      in: path
      required: true
      schema: {type: string}
    put:
      tags: [Admin]
      operationId: admin_rbac_override_set
      summary: Assign a direct ALLOW or DENY
      description: Requires system.settings.manage and a reason. Explicit DENY always overrides role defaults and direct ALLOW.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
