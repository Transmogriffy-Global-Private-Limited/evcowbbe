      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
      - data
    Begin2FAEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Begin2FAData'
      required:
      - data
    HealthEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
      required:
      - data
    VersionEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/VersionData'
      required:
      - data
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required:
      - vehicle_type
      - registration_number
      properties:
        name:
          type: string
          maxLength: 100
          example: My Nexon EV
        vehicle_type:
          type: string
          enum: [CAR, MOTORCYCLE, SCOOTER, THREE_WHEELER, OTHER]
          example: CAR
        make:
          type: string
          maxLength: 100
          example: Tata
        model:
          type: string
          maxLength: 100
          example: Nexon EV
        registration_number:
          type: string
          minLength: 2
          maxLength: 50
          example: KA01AB1234
        battery_capacity_kwh:
          type: number
          format: double
          minimum: 0.1
          example: 40.5
        is_default:
          type: boolean
          example: true
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          example: My Upgraded Nexon
        vehicle_type:
          type: string
          enum: [CAR, MOTORCYCLE, SCOOTER, THREE_WHEELER, OTHER]
          example: CAR
        make:
          type: string
          maxLength: 100
          example: Tata
        model:
          type: string
          maxLength: 100
          example: Nexon EV Max
        registration_number:
          type: string
          minLength: 2
          maxLength: 50
          example: KA01AB1234
        battery_capacity_kwh:
          type: number
          format: double
          minimum: 0.1
          example: 40.5
        is_default:
          type: boolean
          example: true
    VehicleResponse:
      type: object
      required:
      - id
      - customer_account_id
      - vehicle_type
      - registration_number
      - is_default
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        customer_account_id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000000
        name:
          type: string
          nullable: true
          example: My Nexon EV
        vehicle_type:
          type: string
          enum: [CAR, MOTORCYCLE, SCOOTER, THREE_WHEELER, OTHER]
          example: CAR
        make:
          type: string
          nullable: true
          example: Tata
        model:
          type: string
          nullable: true
          example: Nexon EV
        registration_number:
          type: string
          example: KA01AB1234
        battery_capacity_kwh:
          type: number
          format: double
          nullable: true
          example: 40.5
        is_default:
          type: boolean
          example: true
        last_charged:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-27T10:00:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T08:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-27T08:00:00Z'
    VehicleEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/VehicleResponse'
    VehicleListEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'
    VehicleMessageEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              example: vehicle deleted successfully
  responses:
    Ack:
      description: Action completed. For password changes, all existing sessions are revoked; for 2FA confirmation,
        other sessions are revoked.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AckEnvelope'
          example:
            data:
              ok: true
    Accepted:
      description: Generic accepted result. Deliberately does not disclose whether the email/account exists or was
        eligible.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedEnvelope'
          example:
            data:
              accepted: true
    Begin2FA:
      description: A purpose-bound email-OTP challenge was created; use its ID and the emailed code on the matching
        confirm route.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Begin2FAEnvelope'
          example:
            data:
              challenge_id: 00000000-0000-4000-8000-000000000000
              message: Check email for one-time code
    Live:
      description: Process is responding. Does not check the database.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthEnvelope'
          example:
            data:
              status: live
    Ready:
      description: PostgreSQL responded to a bounded readiness ping.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthEnvelope'
          example:
            data:
              status: ready
    Version:
      description: Current program's logical API foundation version (not the Git commit or release ID).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionEnvelope'
          example:
            data:
              version: auth-foundation-2
    LoginApp:
      description: Credentials valid. Without 2FA the response contains tokens; with 2FA it contains a challenge
        ID but no tokens.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
          examples:
            without_2fa:
              summary: 2FA disabled; credentials issued
              value:
                data:
                  two_factor_required: false
                  tokens:
                    access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                    token_type: Bearer
                    access_expires_at: '2026-10-27T10:15:00Z'
                    refresh_expires_at: '2026-11-26T10:00:00Z'
                    session_id: 00000000-0000-4000-8000-000000000000
                    plane: app
            with_2fa:
              summary: 2FA enabled; verify emailed code
              value:
                data:
                  two_factor_required: true
                  challenge_id: 00000000-0000-4000-8000-000000000000
    TokensApp:
      description: New access + rotating refresh tokens. Store both securely; older refresh tokens are invalidated.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenEnvelope'
          example:
            data:
              access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              refresh_token: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              token_type: Bearer
              access_expires_at: '2026-10-27T10:15:00Z'
              refresh_expires_at: '2026-11-26T10:00:00Z'
              session_id: 00000000-0000-4000-8000-000000000000
              plane: app
    ProfileApp:
      description: Profile for the authenticated principal in the requested plane.
      headers:
