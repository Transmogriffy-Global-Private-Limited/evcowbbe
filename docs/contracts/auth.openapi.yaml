    post:
      tags: [Admin]
      operationId: admin_rbac_role_add
      summary: Assign a default Admin role
      description: Requires system.settings.manage, an explicit audit reason, and a distinct target Admin. Does not automatically elevate the actor.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              additionalProperties: false
              properties:
                role: {type: string, enum: [FULL_ADMIN, OPERATIONS, DRIVER_RECRUITMENT, FINANCE_COMMERCIAL, SUPPORT, TECHNICAL_HAL, READ_ONLY]}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        '200':
