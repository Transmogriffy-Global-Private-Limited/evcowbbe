  /api/v1/admin/pricing/policies/{policy_id}/withdraw:
    post:
      tags:
      - Admin Pricing
      operationId: adminPricingWithdraw
      summary: Withdraw a published policy for future selection
      description: |
        Requires pricing.manage, current If-Match ETag and Idempotency-Key. Withdrawal never reprices accepted
        quotes or historical jobs. If no fallback policy remains, future selection fails closed.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PricingPolicyID'
      - $ref: '#/components/parameters/PricingStateETag'
      - $ref: '#/components/parameters/MutationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingTransition'
      responses:
        '200':
          $ref: '#/components/responses/PricingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/FleetNotFound'
        '409':
          $ref: '#/components/responses/FleetConflict'
        '412':
          $ref: '#/components/responses/FleetVersionMismatch'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/FleetValidation'
        '428':
          $ref: '#/components/responses/FleetPrecondition'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Paste an *access* token received from login/verify-otp/refresh for this exact app, driver or
        admin plane. Not JWT, not a refresh token. No cookies or implicit OAuth flow.
  headers:
    RequestID:
      description: Request correlation UUID; also returned in JSON error bodies.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000000
    RetryAfter:
      description: Seconds until retry is advised (currently 60).
      schema:
        type: integer
        minimum: 0
      example: 60
  parameters:
    PricingPolicyID:
      in: path
      name: policy_id
      required: true
      schema:
        type: string
        format: uuid
    PricingStateETag:
      in: header
      name: If-Match
      required: true
      description: Strong, quoted state_version from GET; concurrency guard for publication lifecycle.
      schema:
        type: string
        example: '"1"'
    MutationKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique ASCII key per actor and operation. Keep it stable across retries.
      schema:
        type: string
        minLength: 16
        maxLength: 128
