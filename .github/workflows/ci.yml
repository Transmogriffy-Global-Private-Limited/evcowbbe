name: Source CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Runs only against a brand-new job-local PostgreSQL service. This is a
  # Source CI gate, not a workflow that can reach VPS or production secrets.
  recovery-linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recovery_ci
          POSTGRES_PASSWORD: recovery_ci
          POSTGRES_DB: evcowbbe_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery_ci -d evcowbbe_recovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RECOVERY_TEST_ISOLATED: '1'
      RECOVERY_TEST_POSTGRES_URL: postgres://recovery_ci:recovery_ci@127.0.0.1:5432/evcowbbe_recovery_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check recovery shell syntax and generated Go formatting
        shell: bash
        run: |
          bash -n ops/deploy/vps/upgrade-control-plane.sh
          bash -n ops/deploy/vps/provision-recovery-evidence.sh
          test -z "$(gofmt -l cmd/recovery-ledger-guard)"
      - name: Test Linux-only recovery IPC behavior
        run: python -B -m unittest discover -s ops/deploy/tests -p test_interrupted_build_pg_stream.py -v
      - name: Test real PostgreSQL advisory lock and writer exclusion
        run: go test -count=1 -timeout 4m -tags=recovery_integration ./cmd/recovery-ledger-guard -v
      - name: Build reviewed recovery guard for transient systemd test
        run: go build -trimpath -o "$RUNNER_TEMP/evcowbbe-recovery-ledger-guard-ci" ./cmd/recovery-ledger-guard
      - name: Test actual guard through systemd-run with disposable PostgreSQL
        run: python -B ops/deploy/tests/verify_recovery_systemd_streaming.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployment control-plane source
        run: |
          python -m compileall -q ops/deploy
          python -m unittest discover -s ops/deploy/tests -v
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Verify module checksums
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: go build -o "$RUNNER_TEMP/evcowbbe-server-check" ./cmd/server
      - name: Build migrator
        run: go build -o "$RUNNER_TEMP/evcowbbe-migrate-check" ./cmd/migrate
      - name: Verify embedded migration files
        run: go run ./cmd/migrate verify --files-only
      - name: Build canonical release
        run: |
          release_server_output="$RUNNER_TEMP/evcowbbe"
          release_migrator_output="$RUNNER_TEMP/evcowbbe-migrate"
          release_report="$(bash scripts/build-release.sh --server-output "$release_server_output" --migrator-output "$release_migrator_output")"
          printf '%s\n' "$release_report"
          test -s "$release_server_output"
          test -x "$release_server_output"
          test -s "$release_migrator_output"
          test -x "$release_migrator_output"
          test "$(printf '%s\n' "$release_report" | sed -n 's/^release_git_sha=//p')" = "$GITHUB_SHA"
      - name: Verify release migrator identity
        run: |
          release_migrator_output="$RUNNER_TEMP/evcowbbe-migrate"
          database_url='postgres://ci:ci@127.0.0.1:1/evcowbbe?connect_timeout=1'

          set +e
          timeout 10s env APP_ENV=production BUILD_REVISION="$GITHUB_SHA" DATABASE_URL="$database_url" "$release_migrator_output" verify >"$RUNNER_TEMP/migrator-identity-match.stdout" 2>"$RUNNER_TEMP/migrator-identity-match.stderr"
          matched_status=$?
          set -e
          test "$matched_status" -eq 1
          grep -Fx 'database unavailable' "$RUNNER_TEMP/migrator-identity-match.stderr"

          if [[ "${GITHUB_SHA:0:1}" == "0" ]]; then
            mismatched_revision="1${GITHUB_SHA:1}"
          else
            mismatched_revision="0${GITHUB_SHA:1}"
          fi
          set +e
          timeout 10s env APP_ENV=production BUILD_REVISION="$mismatched_revision" DATABASE_URL="$database_url" "$release_migrator_output" verify >"$RUNNER_TEMP/migrator-identity-mismatch.stdout" 2>"$RUNNER_TEMP/migrator-identity-mismatch.stderr"
          mismatched_status=$?
          set -e
          test "$mismatched_status" -eq 2
          grep -Fx 'invalid release identity: BUILD_REVISION must equal the embedded Git SHA' "$RUNNER_TEMP/migrator-identity-mismatch.stderr"
      - name: Check whitespace errors
        run: git diff --check
